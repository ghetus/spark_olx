name: OLX Projectors Daily Scraper

on:
  schedule:
    # Rulează zilnic la ora 06:00 UTC (09:00 ora României/Moldovei)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite rularea manuală printr-un buton de test

jobs:
  scrape-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Descarcă codul din repository
        uses: actions/checkout@v4

      - name: Configurează mediul Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalează bibliotecile necesare
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execută scriptul de analiză
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_NAME: "Proiectoare OLX"
        run: |
          python main.py
