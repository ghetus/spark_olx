name: OLX Projectors Daily Scraper

on:
  schedule:
    # Rulează zilnic la ora 08:00 UTC (11:00 Ora României/Moldovei)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite declanșarea manuală din interfața GitHub

jobs:
  scrape-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Chechează codul din depozit
        uses: actions/checkout@v4

      - name: Configurare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalare dependențe
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executare script de colectare și analiză
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_NAME: "Proiectoare OLX"
        run: |
          python main.py
